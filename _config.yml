title: Betagento
email: luuvantrung@gmail.com
description: >-
  Magento 2 development, extensions, and a technical blog by Trung Luu.
  Think small. Do simple.
tagline: Think small. Do simple.
baseurl: ""
url: "https://www.betagento.com"
github_username: trunglv

author:
  name: Trung Luu
  email: luuvantrung@gmail.com

permalink: /:categories/:year/:month/:day/:title/

markdown: kramdown
kramdown:
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  extensions:
    output: true
    permalink: /extensions/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: en
  - scope:
      path: ""
      type: pages
    values:
      layout: page
      lang: en
  - scope:
      path: ""
      type: extensions
    values:
      layout: extension
      lang: en
  - scope:
      path: "vi"
    values:
      lang: vi

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - docs/package.json
  - docs/package-lock.json
  - docs/tailwind.config.js
  - _posts_backup

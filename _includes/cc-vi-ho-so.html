<figure class="rag-figure">

    <title id="vho-so-t">Tập hồ sơ gửi đi trong mỗi request</title>
    <desc id="vho-so-d">Mỗi lần gửi, Claude Code xếp vào hồ sơ: hướng dẫn hệ thống và danh sách công cụ, CLAUDE.md và ghi nhớ của dự án, toàn bộ cuộc hội thoại từ đầu, và cuối cùng là câu bạn vừa gõ. Cuộc hội thoại là phần lớn nhất và dày thêm sau mỗi lần dùng công cụ.</desc>
    <defs><marker id="vho-soa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6577"/></marker></defs>
    <rect x="110" y="30" width="400" height="52" rx="8" fill="#0e1b3d"/>
    <text x="310.0" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Hướng dẫn hệ thống + danh sách công cụ</text>
    <rect x="110" y="88" width="400" height="44" rx="8" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="310.0" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">CLAUDE.md + ghi nhớ của dự án</text>

    <text x="310.0" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">câu hỏi và câu trả lời cũ</text>
    <text x="310.0" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">nội dung các file đã đọc</text>
    <text x="310.0" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">kết quả các lệnh đã chạy</text>

    <text x="570" y="96" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">nhỏ, và giống nhau ở mọi lần gửi</text>
    <line x1="516" y1="208" x2="558" y2="208" stroke="#5b6577" stroke-width="1.5" stroke-dasharray="4 4"/>

  <figcaption style="color:var(--color-text-muted);font-size:0.9rem;margin-top:10px;">Tập hồ sơ của một lần gửi. Câu bạn gõ chỉ là tờ mỏng nhất ở cuối.</figcaption>

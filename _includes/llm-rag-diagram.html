<figure class="rag-figure">
  <svg viewBox="0 0 960 400" role="img" aria-labelledby="llm-rag-title llm-rag-desc" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
    <title id="llm-rag-title">How an LLM and RAG work together</title>
    <desc id="llm-rag-desc">A user question goes to the application, which asks the retriever to search the document store. The retrieved chunks are combined with the question into a prompt. The LLM reads the prompt and writes an answer with citations, which goes back to the user.</desc>
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#5b6577"/>
      </marker>
    </defs>

    <!-- Row 1: retrieval (RAG) -->
    <rect x="20" y="50" width="180" height="90" rx="14" fill="#ffffff" stroke="#139e8c" stroke-width="2"/>
    <text x="110" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0e1b3d">User question</text>
    <text x="110" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b6577">"Can I return a TV</text>
    <text x="110" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b6577">after 20 days?"</text>

    <line x1="200" y1="95" x2="262" y2="95" stroke="#5b6577" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="266" y="50" width="180" height="90" rx="14" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="356" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0e1b3d">Retriever</text>
    <text x="356" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b6577">embeds the question</text>
    <text x="356" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b6577">and finds close chunks</text>

    <line x1="356" y1="142" x2="356" y2="200" stroke="#5b6577" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="0"/>
    <!-- Document store (cylinder) -->
    <ellipse cx="356" cy="222" rx="90" ry="14" fill="#f4f6f8" stroke="#0e1b3d" stroke-width="2"/>
    <path d="M266,222 L266,300 A90,14 0 0 0 446,300 L446,222" fill="#f4f6f8" stroke="#0e1b3d" stroke-width="2"/>
    <text x="356" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0e1b3d">Your documents</text>
    <text x="356" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">chunks + vectors</text>

    <!-- Arrow from retriever to prompt -->
    <line x1="446" y1="95" x2="510" y2="95" stroke="#5b6577" stroke-width="2" marker-end="url(#arr)"/>
    <text x="478" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#139e8c">top chunks</text>

    <!-- Prompt -->
    <rect x="514" y="50" width="200" height="90" rx="14" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="614" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0e1b3d">Prompt</text>
    <text x="614" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b6577">instructions + chunks</text>
    <text x="614" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b6577">+ the question</text>

    <line x1="714" y1="95" x2="770" y2="95" stroke="#5b6577" stroke-width="2" marker-end="url(#arr)"/>

    <!-- LLM -->
    <rect x="774" y="40" width="168" height="110" rx="14" fill="#0e1b3d" stroke="#0e1b3d" stroke-width="2"/>
    <text x="858" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">LLM</text>
    <text x="858" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#c9f2ea">reads the prompt</text>
    <text x="858" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#c9f2ea">and writes the answer</text>

    <!-- Answer back to user -->
    <path d="M858,150 L858,200 L110,200 L110,150" fill="none" stroke="#5b6577" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="490" y="180" width="370" height="40" rx="10" fill="#ffffff" stroke="#5b6577" stroke-width="1.5"/>
    <text x="675" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0e1b3d">"No. Electronics have a 15-day window [1]."</text>

    <!-- Labels for the two roles -->
    <rect x="20" y="326" width="420" height="58" rx="10" fill="#f4f6f8"/>
    <text x="34" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">RAG: finds the facts</text>
    <text x="34" y="370" font-family="Arial, sans-serif" font-size="13" fill="#5b6577">search your data, pick the relevant passages, add them to the prompt</text>

    <rect x="520" y="326" width="420" height="58" rx="10" fill="#0e1b3d"/>
    <text x="534" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">LLM: writes the answer</text>
    <text x="534" y="370" font-family="Arial, sans-serif" font-size="13" fill="#c9f2ea">understand the question, use the passages, answer with citations</text>
  </svg>
  <figcaption style="color:var(--color-text-muted);font-size:0.9rem;margin-top:10px;">RAG finds the relevant text. The LLM turns that text and the question into an answer.</figcaption>
</figure>

<figure class="rag-figure">
  <svg viewBox="0 0 960 440" role="img" aria-labelledby="day-title day-desc" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
    <title id="day-title">A day shaped around how Claude Code bills</title>
    <desc id="day-desc">A timeline of one working day. A short planning step in the morning. Two deep blocks, each one session of related tasks. Above the timeline, an urgent lane: an urgent request opens a separate session or worktree and leaves the deep session untouched. Below the timeline, a small-task inbox collects minor tasks during the day instead of doing them as they arrive. At the end of the day, the inbox is processed in one batch session with clear between items on a cheaper model, followed by a short wrap-up that writes memory, checks usage, and sets tomorrow's first prompt.</desc>
    <defs>
      <marker id="da2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6577"/></marker>
      <marker id="dr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
      <marker id="do2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d68910"/></marker>
    </defs>

    <!-- Urgent lane -->
    <text x="30" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#c0392b">Urgent lane</text>
    <rect x="180" y="46" width="340" height="78" rx="10" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/>
    <text x="350" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">Urgent request arrives</text>
    <text x="350" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">new terminal, new session (or a worktree)</text>
    <text x="350" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">/btw if it is only a question</text>
    <line x1="285" y1="124" x2="285" y2="196" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#dr2)"/>
    <text x="295" y="150" font-family="Arial, sans-serif" font-size="11" fill="#c0392b">handled on the side</text>
    <text x="295" y="166" font-family="Arial, sans-serif" font-size="11" fill="#c0392b">deep session untouched</text>

    <!-- Timeline axis -->
    <line x1="30" y1="250" x2="940" y2="250" stroke="#8a94a6" stroke-width="2"/>
    <text x="40" y="192" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">morning</text>
    <text x="940" y="192" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">evening</text>

    <!-- Plan -->
    <rect x="40" y="200" width="80" height="100" rx="10" fill="#f4f6f8" stroke="#8a94a6" stroke-width="1.5"/>
    <text x="80" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">Plan</text>
    <text x="80" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5b6577">10 minutes</text>
    <text x="80" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5b6577">group tasks</text>
    <text x="80" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5b6577">pick models</text>
    <text x="80" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5b6577">leave room</text>

    <!-- Deep block A -->
    <rect x="130" y="200" width="280" height="100" rx="10" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="270" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">Deep block A: one session</text>
    <text x="270" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">related tasks only, specific first prompt</text>
    <text x="270" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">/compact &lt;focus&gt; at a boundary</text>
    <text x="270" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">no model switch, no long pause</text>
    <text x="270" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">/clear when the block ends</text>

    <!-- Deep block B -->
    <rect x="420" y="200" width="280" height="100" rx="10" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="560" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">Deep block B: one session</text>
    <text x="560" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">a different topic, fresh context</text>
    <text x="560" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">noisy work in subagents</text>
    <text x="560" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">small things that come up:</text>
    <text x="560" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">into the inbox, not the session</text>

    <!-- Batch -->
    <rect x="710" y="200" width="150" height="100" rx="10" fill="#fff8e6" stroke="#d68910" stroke-width="2"/>
    <text x="785" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">Batch the inbox</text>
    <text x="785" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">one session, cheap model</text>
    <text x="785" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">/clear between items</text>
    <text x="785" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">claude -p for the</text>
    <text x="785" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">mechanical ones</text>

    <!-- Wrap-up -->
    <rect x="870" y="200" width="70" height="100" rx="10" fill="#0e1b3d"/>
    <text x="905" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Wrap</text>
    <text x="905" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c9f2ea">memory</text>
    <text x="905" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c9f2ea">/usage</text>
    <text x="905" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c9f2ea">tomorrow's</text>
    <text x="905" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c9f2ea">first prompt</text>

    <!-- Inbox lane -->
    <text x="30" y="352" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#d68910">Small-task inbox</text>
    <rect x="180" y="360" width="520" height="56" rx="10" fill="#fff8e6" stroke="#d68910" stroke-width="2"/>
    <text x="440" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">Collect, do not do: a rename, a doc tweak, a question that can wait</text>
    <text x="440" y="404" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">each item written down in one line; none of them enters a deep session</text>
    <line x1="220" y1="300" x2="220" y2="356" stroke="#d68910" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#do2)"/>
    <line x1="350" y1="300" x2="350" y2="356" stroke="#d68910" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#do2)"/>
    <line x1="500" y1="300" x2="500" y2="356" stroke="#d68910" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#do2)"/>
    <line x1="640" y1="300" x2="640" y2="356" stroke="#d68910" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#do2)"/>
    <path d="M700,388 L785,388 L785,304" fill="none" stroke="#d68910" stroke-width="2" marker-end="url(#do2)"/>
    <text x="742" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#d68910">end of day</text>
  </svg>
  <figcaption style="color:var(--color-text-muted);font-size:0.9rem;margin-top:10px;">Long sessions on related work, interruptions kept on the side, and small tasks batched once. The day's shape does the saving, so you do not have to think about tokens while you work.</figcaption>
</figure>

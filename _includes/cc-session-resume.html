<figure class="rag-figure">
  <svg viewBox="0 0 960 360" role="img" aria-labelledby="sess-title sess-desc" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
    <title id="sess-title">Where a session lives and what resuming it costs</title>
    <desc id="sess-desc">While you work, every message, tool call, tool result and token count is appended to a transcript file on disk. Closing Claude Code keeps the file. Resuming loads the transcript back into context: the first API call after a resume pays to write the old conversation into the cache again if the cache has expired, and later calls read it cheaply. Compacting replaces older messages in context with a summary while the file keeps the full record.</desc>
    <defs>
      <marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6577"/></marker>
    </defs>

    <!-- live session -->
    <rect x="30" y="40" width="250" height="110" rx="12" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="155" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">Live session (in context)</text>
    <text x="155" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">system prompt, CLAUDE.md, tools,</text>
    <text x="155" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">and the conversation so far</text>
    <text x="155" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#139e8c">sent on every API call</text>

    <line x1="280" y1="95" x2="356" y2="95" stroke="#5b6577" stroke-width="2" marker-end="url(#sa)"/>
    <text x="318" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">appended</text>
    <text x="318" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">as you go</text>

    <!-- transcript on disk -->
    <rect x="360" y="40" width="270" height="110" rx="12" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="495" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">Transcript file on disk</text>
    <text x="495" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">~/.claude/projects/&lt;project&gt;/&lt;session-id&gt;.jsonl</text>
    <text x="495" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">one JSON record per line: messages,</text>
    <text x="495" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">tool calls, results, token usage</text>

    <!-- close / resume -->
    <line x1="495" y1="150" x2="495" y2="196" stroke="#5b6577" stroke-width="2" marker-end="url(#sa)"/>
    <text x="508" y="176" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">close Claude Code: the file stays</text>

    <rect x="360" y="200" width="270" height="56" rx="12" fill="#fff8e6" stroke="#d68910" stroke-width="2"/>
    <text x="495" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">claude --continue / --resume</text>
    <text x="495" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">transcript loaded back into context</text>

    <line x1="360" y1="228" x2="284" y2="228" stroke="#5b6577" stroke-width="2" marker-end="url(#sa)"/>

    <rect x="30" y="200" width="250" height="56" rx="12" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="155" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">First call after resume</text>
    <text x="155" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">cache read if still warm, else written again</text>

    <line x1="155" y1="256" x2="155" y2="292" stroke="#5b6577" stroke-width="2" marker-end="url(#sa)"/>
    <rect x="30" y="296" width="250" height="48" rx="12" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="155" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">Later calls</text>
    <text x="155" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">cache reads again, cheap</text>

    <!-- compact -->
    <rect x="690" y="40" width="240" height="110" rx="12" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="810" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">/compact</text>
    <text x="810" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">older messages in context are</text>
    <text x="810" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">replaced by a summary</text>
    <text x="810" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">the file keeps the full record</text>
    <line x1="690" y1="95" x2="636" y2="95" stroke="#5b6577" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#sa)"/>

    <rect x="690" y="200" width="240" height="144" rx="10" fill="#f4f6f8"/>
    <text x="706" y="224" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">Two different things</text>
    <text x="706" y="248" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">History on disk: permanent,</text>
    <text x="706" y="266" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">costs nothing to keep.</text>
    <text x="706" y="294" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">Cache at the API: temporary,</text>
    <text x="706" y="312" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">expires after a short idle time,</text>
    <text x="706" y="330" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">and must be rebuilt after that.</text>
  </svg>
  <figcaption style="color:var(--color-text-muted);font-size:0.9rem;margin-top:10px;">Resuming brings the conversation back; the cache comes back only if it has not expired. The history is free to store; re-reading it into the model is what costs tokens.</figcaption>
</figure>

<figure class="rag-figure">
  <svg viewBox="0 0 960 400" role="img" aria-labelledby="gate-title gate-desc" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
    <title id="gate-title">An evaluation gate in front of Claude Code</title>
    <desc id="gate-desc">A prompt passes through four checks before any expensive request: rule checks, a token count with the current context size, a cheap classifier, and a decision. The decision has four outcomes: answer with a cheap or local model, send back a clarifying question, run Claude Code with a chosen model, effort and turn limit, or reuse an earlier result. After the run, the usage is written to a history that improves the next estimate.</desc>
    <defs>
      <marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6577"/></marker>
      <marker id="gt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#139e8c"/></marker>
    </defs>

    <!-- pipeline row -->
    <rect x="20" y="60" width="100" height="64" rx="10" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="70" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">Prompt</text>
    <text x="70" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">from the tool</text>
    <line x1="120" y1="92" x2="146" y2="92" stroke="#5b6577" stroke-width="2" marker-end="url(#ga)"/>

    <rect x="150" y="60" width="140" height="64" rx="10" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="220" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">1. Rule checks</text>
    <text x="220" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">length, file names,</text>
    <text x="220" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">pasted logs, duplicates</text>
    <line x1="290" y1="92" x2="316" y2="92" stroke="#5b6577" stroke-width="2" marker-end="url(#ga)"/>

    <rect x="320" y="60" width="140" height="64" rx="10" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="390" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">2. Count</text>
    <text x="390" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">count_tokens +</text>
    <text x="390" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">current context size</text>
    <line x1="460" y1="92" x2="486" y2="92" stroke="#5b6577" stroke-width="2" marker-end="url(#ga)"/>

    <rect x="490" y="60" width="140" height="64" rx="10" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="560" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">3. Classify</text>
    <text x="560" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">cheap or local model</text>
    <text x="560" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">returns a small JSON</text>
    <line x1="630" y1="92" x2="656" y2="92" stroke="#5b6577" stroke-width="2" marker-end="url(#ga)"/>

    <rect x="660" y="52" width="130" height="80" rx="10" fill="#fff8e6" stroke="#d68910" stroke-width="2"/>
    <text x="725" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">4. Decide</text>
    <text x="725" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">one of four paths</text>

    <!-- outcomes -->
    <line x1="790" y1="70" x2="826" y2="70" stroke="#5b6577" stroke-width="2" marker-end="url(#ga)"/>
    <line x1="790" y1="92" x2="826" y2="118" stroke="#5b6577" stroke-width="2" marker-end="url(#ga)"/>
    <line x1="790" y1="112" x2="826" y2="166" stroke="#5b6577" stroke-width="2" marker-end="url(#ga)"/>
    <line x1="790" y1="124" x2="826" y2="214" stroke="#5b6577" stroke-width="2" marker-end="url(#ga)"/>

    <g font-family="Arial, sans-serif" font-size="11">
      <rect x="830" y="54" width="110" height="32" rx="8" fill="#ffffff" stroke="#8a94a6" stroke-width="1.5"/>
      <text x="885" y="74" text-anchor="middle" fill="#0e1b3d">Answer cheaply</text>
      <rect x="830" y="102" width="110" height="32" rx="8" fill="#ffffff" stroke="#8a94a6" stroke-width="1.5"/>
      <text x="885" y="122" text-anchor="middle" fill="#0e1b3d">Ask to clarify</text>
      <rect x="830" y="150" width="110" height="32" rx="8" fill="#ffffff" stroke="#8a94a6" stroke-width="1.5"/>
      <text x="885" y="170" text-anchor="middle" fill="#0e1b3d">Reuse old result</text>
      <rect x="830" y="198" width="110" height="32" rx="8" fill="#0e1b3d"/>
      <text x="885" y="218" text-anchor="middle" fill="#ffffff" font-weight="700">Run Claude Code</text>
    </g>

    <!-- run box -->
    <rect x="490" y="200" width="300" height="80" rx="10" fill="#f4f6f8" stroke="#8a94a6" stroke-width="1.5"/>
    <text x="640" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">The run, with limits chosen by the gate</text>
    <text x="640" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">model, effort, --max-turns, plan mode first for big tasks</text>
    <text x="640" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">--output-format json returns the usage when it ends</text>
    <path d="M885,230 L885,240 L790,240" fill="none" stroke="#5b6577" stroke-width="2" marker-end="url(#ga)"/>

    <!-- history feedback -->
    <rect x="150" y="200" width="280" height="80" rx="10" fill="#f4f6f8" stroke="#8a94a6" stroke-width="1.5"/>
    <text x="290" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">History</text>
    <text x="290" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">per task type: requests used, tokens, cost</text>
    <text x="290" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">makes the next estimate better</text>
    <line x1="490" y1="240" x2="434" y2="240" stroke="#139e8c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#gt)"/>
    <path d="M290,200 L290,160 L390,160 L390,128" fill="none" stroke="#139e8c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#gt)"/>
    <text x="340" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#139e8c">feeds the estimate</text>

    <!-- footnote -->
    <rect x="20" y="310" width="920" height="70" rx="10" fill="#f4f6f8"/>
    <text x="38" y="334" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">What the gate costs</text>
    <text x="38" y="354" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">Rule checks: nothing. count_tokens: free. The classifier: a few hundred tokens on a cheap or local model. A wasted Claude Code loop on a vague prompt:</text>
    <text x="38" y="370" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">five to twenty requests, each re-sending the whole context. The gate pays for itself the first time it sends a question back instead of a loop out.</text>
  </svg>
  <figcaption style="color:var(--color-text-muted);font-size:0.9rem;margin-top:10px;">The gate sits between whatever produces the prompt and Claude Code. Its decisions are cheap; the loop it prevents is not.</figcaption>
</figure>

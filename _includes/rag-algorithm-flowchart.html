<figure class="rag-figure">
  <svg viewBox="0 0 960 560" role="img" aria-labelledby="algo-title algo-desc" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
    <title id="algo-title">RAG algorithm flowchart</title>
    <desc id="algo-desc">Left column: indexing runs once. Read documents, split into chunks, embed each chunk, save vectors and chunk text. Right column: answering runs per question. Embed the question, score it against all chunk vectors, check whether a relevant chunk was found. If yes, keep the top chunks, build the prompt, let the LLM write the answer with citations, and return it. If no, reply that the answer is not known.</desc>
    <defs>
      <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#5b6577"/>
      </marker>
    </defs>

    <!-- Column headers -->
    <text x="230" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0e1b3d">A. Build the index (once, or when documents change)</text>
    <text x="690" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0e1b3d">B. Answer a question (every request)</text>

    <!-- ===== A. Indexing column (x centre 230) ===== -->
    <ellipse cx="230" cy="62" rx="110" ry="20" fill="#0e1b3d"/>
    <text x="230" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Start: documents</text>
    <line x1="230" y1="82" x2="230" y2="106" stroke="#5b6577" stroke-width="2" marker-end="url(#fa)"/>

    <rect x="80" y="108" width="300" height="50" rx="10" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="230" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0e1b3d">Read each document</text>
    <line x1="230" y1="158" x2="230" y2="180" stroke="#5b6577" stroke-width="2" marker-end="url(#fa)"/>

    <rect x="80" y="182" width="300" height="50" rx="10" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="230" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0e1b3d">Split into chunks</text>
    <line x1="230" y1="232" x2="230" y2="254" stroke="#5b6577" stroke-width="2" marker-end="url(#fa)"/>

    <rect x="80" y="256" width="300" height="50" rx="10" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="230" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">Embed each chunk</text>
    <text x="230" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">embedding model, in batches</text>
    <line x1="230" y1="306" x2="230" y2="328" stroke="#5b6577" stroke-width="2" marker-end="url(#fa)"/>

    <rect x="80" y="330" width="300" height="50" rx="10" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="230" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0e1b3d">Save vectors and chunk text</text>
    <text x="230" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">plus metadata and model version</text>
    <line x1="230" y1="380" x2="230" y2="402" stroke="#5b6577" stroke-width="2" marker-end="url(#fa)"/>

    <ellipse cx="230" cy="422" rx="110" ry="20" fill="#0e1b3d"/>
    <text x="230" y="427" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Index ready</text>

    <!-- ===== B. Answering column (x centre 690) ===== -->
    <ellipse cx="690" cy="62" rx="120" ry="20" fill="#0e1b3d"/>
    <text x="690" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Start: user question</text>
    <line x1="690" y1="82" x2="690" y2="106" stroke="#5b6577" stroke-width="2" marker-end="url(#fa)"/>

    <rect x="540" y="108" width="300" height="50" rx="10" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="690" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">Embed the question</text>
    <text x="690" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">same embedding model as indexing</text>
    <line x1="690" y1="158" x2="690" y2="180" stroke="#5b6577" stroke-width="2" marker-end="url(#fa)"/>

    <rect x="540" y="182" width="300" height="50" rx="10" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="690" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0e1b3d">Score against all chunk vectors</text>
    <text x="690" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">rank by similarity</text>
    <line x1="690" y1="232" x2="690" y2="250" stroke="#5b6577" stroke-width="2" marker-end="url(#fa)"/>

    <!-- Decision -->
    <polygon points="690,252 790,284 690,316 590,284" fill="#fff8e6" stroke="#b7791f" stroke-width="2"/>
    <text x="690" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">Relevant chunk</text>
    <text x="690" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">above threshold?</text>

    <!-- No branch -->
    <line x1="790" y1="284" x2="842" y2="284" stroke="#5b6577" stroke-width="2" marker-end="url(#fa)"/>
    <text x="816" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#b7791f">no</text>
    <rect x="846" y="250" width="100" height="68" rx="10" fill="#f4f6f8" stroke="#5b6577" stroke-width="1.5"/>
    <text x="896" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">Reply:</text>
    <text x="896" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">not in sources</text>
    <path d="M896,318 L896,528 L810,528" fill="none" stroke="#5b6577" stroke-width="2" marker-end="url(#fa)"/>

    <!-- Yes branch -->
    <line x1="690" y1="316" x2="690" y2="338" stroke="#5b6577" stroke-width="2" marker-end="url(#fa)"/>
    <text x="704" y="332" font-family="Arial, sans-serif" font-size="11" fill="#139e8c">yes</text>

    <rect x="540" y="340" width="300" height="46" rx="10" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="690" y="367" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0e1b3d">Keep the top-k chunks</text>
    <line x1="690" y1="386" x2="690" y2="406" stroke="#5b6577" stroke-width="2" marker-end="url(#fa)"/>

    <rect x="540" y="408" width="300" height="50" rx="10" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="690" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">Build the prompt</text>
    <text x="690" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">instructions, numbered sources, question</text>
    <line x1="690" y1="458" x2="690" y2="478" stroke="#5b6577" stroke-width="2" marker-end="url(#fa)"/>

    <rect x="540" y="480" width="300" height="46" rx="10" fill="#0e1b3d" stroke="#0e1b3d" stroke-width="2"/>
    <text x="690" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">LLM writes the answer</text>
    <text x="690" y="516" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c9f2ea">with citations [n]</text>
    <line x1="690" y1="526" x2="690" y2="540" stroke="#5b6577" stroke-width="2" marker-end="url(#fa)"/>

    <ellipse cx="690" cy="548" rx="0" ry="0" fill="none"/>
    <text x="690" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">End: return the answer</text>

    <!-- Link from the saved index to scoring (dashed) -->
    <path d="M380,355 L470,355 L470,207 L540,207" fill="none" stroke="#139e8c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fa)"/>
    <text x="425" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#139e8c">saved index</text>
  </svg>
  <figcaption style="color:var(--color-text-muted);font-size:0.9rem;margin-top:10px;">Indexing (A) runs ahead of time. Answering (B) reads the saved index for every question and stops early when no relevant chunk is found.</figcaption>
</figure>

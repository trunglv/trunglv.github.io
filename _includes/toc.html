<nav class="post-toc" id="post-toc" aria-label="Table of contents" hidden>
  <p class="post-toc-title">Contents</p>
  <ol class="post-toc-list"></ol>
</nav>
<style>
  .post-toc { border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-card-bg); padding: 18px 22px; margin: 24px 0 32px; }
  .post-toc[hidden] { display: none; }
  .post-toc-title { margin: 0 0 10px; font-weight: 700; color: var(--color-text); }
  .post-toc-list { margin: 0; padding-left: 1.3em; columns: 2; column-gap: 28px; }
  .post-toc-list li { break-inside: avoid; margin: 0 0 6px; font-size: 0.93rem; }
  .post-toc-list a { color: var(--color-text); }
  .post-toc-list a:hover { color: var(--color-accent); }
  @media (max-width: 600px) { .post-toc-list { columns: 1; } }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var nav = document.getElementById('post-toc');
    if (!nav) return;
    var heads = document.querySelectorAll('.post-content h2');
    if (!heads.length) return;
    var list = nav.querySelector('.post-toc-list');
    Array.prototype.forEach.call(heads, function (h) {
      if (!h.id) return;
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent.trim();
      li.appendChild(a);
      list.appendChild(li);
    });
    nav.hidden = false;
  });
</script>

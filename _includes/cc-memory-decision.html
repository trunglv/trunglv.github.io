<figure class="rag-figure">
  <svg viewBox="0 0 960 600" role="img" aria-labelledby="mem-title mem-desc" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
    <title id="mem-title">Where should this piece of knowledge live?</title>
    <desc id="mem-desc">A chain of five yes-or-no questions. Can Claude get it by reading the code? If yes, store it nowhere. Is it needed on every task in this project? If yes, CLAUDE.md. Does it apply only to certain files or folders? If yes, a path-scoped rule. Is it a procedure you run sometimes? If yes, a skill or custom command. Is it something you learned while working, such as a preference or a correction? If yes, auto memory. Otherwise it is task state and belongs in the conversation or a plan file.</desc>
    <defs>
      <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6577"/></marker>
      <marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#139e8c"/></marker>
    </defs>

    <text x="30" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">Where should this piece of knowledge live?</text>

    <!-- Q1 -->
    <polygon points="330,52 500,96 330,140 160,96" fill="#fff8e6" stroke="#d68910" stroke-width="2"/>
    <text x="330" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">Can Claude get it by</text>
    <text x="330" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">reading the code?</text>
    <line x1="500" y1="96" x2="596" y2="96" stroke="#139e8c" stroke-width="2.5" marker-end="url(#mt)"/>
    <text x="548" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#139e8c">yes</text>
    <rect x="600" y="68" width="340" height="56" rx="10" fill="#f4f6f8" stroke="#8a94a6" stroke-width="1.5"/>
    <text x="616" y="92" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">Nowhere. Let it read.</text>
    <text x="616" y="110" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">Stored copies go stale and cost tokens every session</text>
    <line x1="330" y1="140" x2="330" y2="160" stroke="#5b6577" stroke-width="2" marker-end="url(#ma)"/>
    <text x="342" y="156" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">no</text>

    <!-- Q2 -->
    <polygon points="330,162 500,206 330,250 160,206" fill="#fff8e6" stroke="#d68910" stroke-width="2"/>
    <text x="330" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">Needed on every task</text>
    <text x="330" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">in this project?</text>
    <line x1="500" y1="206" x2="596" y2="206" stroke="#139e8c" stroke-width="2.5" marker-end="url(#mt)"/>
    <text x="548" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#139e8c">yes</text>
    <rect x="600" y="178" width="340" height="56" rx="10" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="616" y="202" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">CLAUDE.md</text>
    <text x="616" y="220" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">loads at launch, every session; keep it under 200 lines</text>
    <line x1="330" y1="250" x2="330" y2="270" stroke="#5b6577" stroke-width="2" marker-end="url(#ma)"/>
    <text x="342" y="266" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">no</text>

    <!-- Q3 -->
    <polygon points="330,272 500,316 330,360 160,316" fill="#fff8e6" stroke="#d68910" stroke-width="2"/>
    <text x="330" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">Only for certain</text>
    <text x="330" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">files or folders?</text>
    <line x1="500" y1="316" x2="596" y2="316" stroke="#139e8c" stroke-width="2.5" marker-end="url(#mt)"/>
    <text x="548" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#139e8c">yes</text>
    <rect x="600" y="288" width="340" height="56" rx="10" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="616" y="312" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">A path-scoped rule in .claude/rules/</text>
    <text x="616" y="330" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">loads only when Claude touches a matching file</text>
    <line x1="330" y1="360" x2="330" y2="380" stroke="#5b6577" stroke-width="2" marker-end="url(#ma)"/>
    <text x="342" y="376" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">no</text>

    <!-- Q4 -->
    <polygon points="330,382 500,426 330,470 160,426" fill="#fff8e6" stroke="#d68910" stroke-width="2"/>
    <text x="330" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">A procedure you</text>
    <text x="330" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">run sometimes?</text>
    <line x1="500" y1="426" x2="596" y2="426" stroke="#139e8c" stroke-width="2.5" marker-end="url(#mt)"/>
    <text x="548" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#139e8c">yes</text>
    <rect x="600" y="398" width="340" height="56" rx="10" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="616" y="422" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">A skill or custom slash command</text>
    <text x="616" y="440" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">description loads at start; the body only when used</text>
    <line x1="330" y1="470" x2="330" y2="490" stroke="#5b6577" stroke-width="2" marker-end="url(#ma)"/>
    <text x="342" y="486" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">no</text>

    <!-- Q5 -->
    <polygon points="330,492 500,536 330,580 160,536" fill="#fff8e6" stroke="#d68910" stroke-width="2"/>
    <text x="330" y="524" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">Learned while working?</text>
    <text x="330" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">a preference, a correction,</text>
    <text x="330" y="554" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">a fact not in the code</text>
    <line x1="500" y1="536" x2="596" y2="536" stroke="#139e8c" stroke-width="2.5" marker-end="url(#mt)"/>
    <text x="548" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#139e8c">yes</text>
    <rect x="600" y="508" width="340" height="56" rx="10" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="616" y="532" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">Auto memory</text>
    <text x="616" y="550" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">say "remember that..."; first 200 lines load each session</text>

    <!-- final no -->
    <text x="160" y="596" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">no: it is task state. Keep it in the conversation or a plan file, not in memory.</text>
  </svg>
  <figcaption style="color:var(--color-text-muted);font-size:0.9rem;margin-top:10px;">Each answer picks a storage with a different token cost: CLAUDE.md and memory are paid on every session, rules and skills only when used, and the code costs nothing until it is read.</figcaption>
</figure>

<figure class="rag-figure">
  <svg viewBox="0 0 960 420" role="img" aria-labelledby="loop-title loop-desc" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
    <title id="loop-title">One Claude Code turn: the agent loop</title>
    <desc id="loop-desc">You type a prompt. Claude Code builds a request from the system prompt, CLAUDE.md, tool definitions, and the whole conversation so far, and sends it to the Claude API. The model replies with text or a tool call. If it is a tool call, Claude Code runs the tool locally, appends the result to the conversation, and sends the whole conversation again. When the model replies with text only, the turn ends and you see the reply.</desc>
    <defs>
      <marker id="la" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6577"/></marker>
      <marker id="lt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#139e8c"/></marker>
    </defs>

    <rect x="30" y="40" width="170" height="60" rx="12" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="115" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">You type a prompt</text>
    <text x="115" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">a new user message</text>
    <line x1="200" y1="70" x2="246" y2="70" stroke="#5b6577" stroke-width="2" marker-end="url(#la)"/>

    <rect x="250" y="25" width="260" height="90" rx="12" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="380" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">Claude Code builds the request</text>
    <text x="380" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">system prompt + CLAUDE.md + tool definitions</text>
    <text x="380" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">+ the whole conversation so far</text>
    <text x="380" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">+ the new message</text>
    <line x1="510" y1="70" x2="556" y2="70" stroke="#5b6577" stroke-width="2" marker-end="url(#la)"/>

    <rect x="560" y="40" width="150" height="60" rx="12" fill="#0e1b3d"/>
    <text x="635" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Claude API</text>
    <text x="635" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c9f2ea">one call, tokens billed</text>
    <line x1="710" y1="70" x2="756" y2="70" stroke="#5b6577" stroke-width="2" marker-end="url(#la)"/>

    <rect x="760" y="25" width="170" height="90" rx="12" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="845" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">Model replies</text>
    <text x="845" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">text for you, or</text>
    <text x="845" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">"run this tool with</text>
    <text x="845" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">these arguments"</text>

    <!-- decision -->
    <line x1="845" y1="115" x2="845" y2="150" stroke="#5b6577" stroke-width="2" marker-end="url(#la)"/>
    <polygon points="845,152 935,192 845,232 755,192" fill="#fff8e6" stroke="#d68910" stroke-width="2"/>
    <text x="845" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">Tool call?</text>
    <text x="845" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">yes / no</text>

    <!-- no branch -> reply shown -->
    <line x1="845" y1="232" x2="845" y2="300" stroke="#5b6577" stroke-width="2" marker-end="url(#la)"/>
    <text x="858" y="268" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">no</text>
    <rect x="740" y="304" width="210" height="60" rx="12" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="845" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">Reply shown to you</text>
    <text x="845" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">the turn ends</text>

    <!-- yes branch -> run tool -> append -> back -->
    <line x1="755" y1="192" x2="676" y2="192" stroke="#139e8c" stroke-width="2.5" marker-end="url(#lt)"/>
    <text x="715" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#139e8c">yes</text>
    <rect x="440" y="160" width="232" height="64" rx="12" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="556" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">Claude Code runs the tool</text>
    <text x="556" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">Read, Edit, Bash, an MCP tool...</text>
    <line x1="440" y1="192" x2="372" y2="192" stroke="#139e8c" stroke-width="2.5" marker-end="url(#lt)"/>
    <rect x="150" y="160" width="218" height="64" rx="12" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="259" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">Result added to the</text>
    <text x="259" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">conversation</text>
    <path d="M259,160 L259,140 L300,140 L300,118" fill="none" stroke="#139e8c" stroke-width="2.5" marker-end="url(#lt)"/>
    <text x="150" y="246" font-family="Arial, sans-serif" font-size="12" fill="#139e8c">back to "builds the request": the whole conversation is sent again</text>

    <!-- footer note -->
    <rect x="30" y="300" width="640" height="90" rx="10" fill="#f4f6f8"/>
    <text x="48" y="326" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">What this means for tokens</text>
    <text x="48" y="348" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">One turn can be many API calls, one per tool call. Each call sends everything that came before.</text>
    <text x="48" y="368" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">The repeated part is served from the prompt cache at a fraction of the price, which is why this is affordable.</text>
  </svg>
  <figcaption style="color:var(--color-text-muted);font-size:0.9rem;margin-top:10px;">A turn is a loop, not a single request. The model never runs tools itself: Claude Code runs them on your machine and feeds the results back.</figcaption>
</figure>

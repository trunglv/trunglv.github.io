    <desc id="dcv-desc">Đảng Dân chủ thắng cả hai viện nhưng không đủ 2/3 để vượt phủ quyết. Tác động đi theo ba hướng. Ở Washington, luật AI lớn khó thông qua nhưng có nhiều điều trần hơn, tác động nhỏ lên chi phí. Ở cấp bang, các bang giữ quyền ra luật nên các hãng tốn thêm chi phí tuân thủ, tác động nhỏ. Với data center, thêm hạn chế làm dự án chậm và nguồn cung eo hẹp, tác động lớn nhất nhưng từ khoảng 2028 mới thấy rõ. Chi phí sử dụng AI còn chịu sức ép từ thiếu chip nhớ và GPU, đồng thời được kéo xuống nhờ cạnh tranh và model hiệu quả hơn. Dự đoán là chi phí sẽ phân hóa: model phổ thông tiếp tục rẻ đi, model mạnh nhất giữ giá cao hoặc bị giới hạn sử dụng chặt hơn.</desc>

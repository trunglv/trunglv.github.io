<figure class="rag-figure">
  <div style="overflow-x:auto;">
  <svg viewBox="0 0 960 700" role="img" aria-labelledby="acd-title acd-desc" xmlns="http://www.w3.org/2000/svg" style="width:100%;min-width:640px;height:auto;">
    <title id="acd-title">AI thiết kế chip tác động đến ngành gia công thiết kế vi mạch và kế hoạch phát triển bán dẫn Việt Nam như thế nào</title>
    <desc id="acd-desc">Anthropic, OpenAI và các hãng EDA dùng AI agent trong thiết kế chip. AI làm được nhiều ở verification, RTL và back-end, làm được ít ở kiến trúc, analog và hậu silicon. Với ngành gia công thiết kế vi mạch Việt Nam, khoảng 7.000 kỹ sư chủ yếu làm verification và back-end nên bị ép năng suất và giảm tuyển junior trước. Với kế hoạch phát triển bán dẫn, mục tiêu 50.000 kỹ sư có nguy cơ đào tạo sai kỹ năng, nhưng chi phí thiết kế giảm mở cơ hội cho công ty fabless Việt Nam. Nhà máy Viettel ít bị tác động trực tiếp.</desc>
    <defs><marker id="acd-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6577"/></marker></defs>

    <rect x="180" y="16" width="600" height="70" rx="10" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="480" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0e1b3d">Anthropic, OpenAI và các hãng EDA dùng AI agent để thiết kế chip</text>
    <text x="480" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#5b6577">Đội 15 người làm chip riêng. Số liệu rút ngắn thời gian do hãng tự công bố</text>

    <path d="M480 86 V104 H250 V124" fill="none" stroke="#5b6577" stroke-width="2" marker-end="url(#acd-c)"/>
    <path d="M480 86 V104 H710 V124" fill="none" stroke="#5b6577" stroke-width="2" marker-end="url(#acd-c)"/>

    <rect x="60" y="128" width="380" height="84" rx="10" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="250" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0e1b3d">AI làm được nhiều</text>
    <text x="250" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#5b6577">Verification, sinh RTL từ đặc tả,</text>
    <text x="250" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#5b6577">place and route, timing closure</text>

    <rect x="520" y="128" width="380" height="84" rx="10" fill="#fdf3e3" stroke="#d68910" stroke-width="2"/>
    <text x="710" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0e1b3d">AI làm được ít</text>
    <text x="710" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#5b6577">Kiến trúc và đặc tả, analog và RF,</text>
    <text x="710" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#5b6577">tape-out, đo chip thật, làm việc với foundry</text>

    <path d="M250 212 V240" fill="none" stroke="#5b6577" stroke-width="2" marker-end="url(#acd-c)"/>
    <path d="M710 212 V240" fill="none" stroke="#5b6577" stroke-width="2" marker-end="url(#acd-c)"/>

    <rect x="60" y="244" width="380" height="84" rx="10" fill="#f4f6f8" stroke="#8a94a6" stroke-width="2"/>
    <text x="250" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0e1b3d">Đây là việc Việt Nam làm nhiều nhất</text>
    <text x="250" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#5b6577">Khoảng 7.000 kỹ sư tại Renesas, Marvell, Synopsys...</text>
    <text x="250" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#5b6577">chủ yếu ở vai hỗ trợ, ít chạm IP cốt lõi</text>

    <rect x="520" y="244" width="380" height="84" rx="10" fill="#f4f6f8" stroke="#8a94a6" stroke-width="2"/>
    <text x="710" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0e1b3d">Đây là việc Việt Nam còn ít người</text>
    <text x="710" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#5b6577">Kinh nghiệm với chip thật và dữ liệu kín</text>
    <text x="710" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#5b6577">vẫn là tài sản khó thay</text>

    <path d="M250 328 V356" fill="none" stroke="#5b6577" stroke-width="2" marker-end="url(#acd-c)"/>
    <path d="M710 328 V356" fill="none" stroke="#5b6577" stroke-width="2" marker-end="url(#acd-c)"/>

    <rect x="60" y="360" width="380" height="84" rx="10" fill="#fdf3e3" stroke="#d68910" stroke-width="2"/>
    <text x="250" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0e1b3d">Ngành gia công thiết kế: bị ép trước</text>
    <text x="250" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#5b6577">Ép năng suất như gia công phần mềm,</text>
    <text x="250" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#5b6577">giảm tuyển junior, mất bậc thang vào nghề</text>

    <rect x="520" y="360" width="380" height="84" rx="10" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="710" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0e1b3d">Cơ hội: làm chip riêng rẻ hơn</text>
    <text x="710" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#5b6577">Viettel, FPT Semiconductor và công ty điện tử</text>
    <text x="710" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#5b6577">có thể làm chip với đội vài chục người</text>

    <path d="M250 444 V472 H480 V492" fill="none" stroke="#5b6577" stroke-width="2" marker-end="url(#acd-c)"/>
    <path d="M710 444 V472 H480 V492" fill="none" stroke="#5b6577" stroke-width="2"/>

    <rect x="130" y="496" width="700" height="84" rx="10" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="480" y="524" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0e1b3d">Kế hoạch phát triển bán dẫn: 50.000 kỹ sư cần đổi nội dung</text>
    <text x="480" y="546" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#5b6577">Dạy kiến trúc, analog, hậu silicon và cách làm việc với agent,</text>
    <text x="480" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#5b6577">thay vì chủ yếu dạy verification và chạy công cụ</text>

    <path d="M480 580 V608" fill="none" stroke="#5b6577" stroke-width="2" marker-end="url(#acd-c)"/>

    <rect x="130" y="612" width="700" height="70" rx="10" fill="#f4f6f8" stroke="#8a94a6" stroke-width="2"/>
    <text x="480" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0e1b3d">Nhà máy Viettel: ít bị AI thiết kế tác động</text>
    <text x="480" y="661" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#5b6577">Rủi ro nằm ở tiến độ 2027 và mua thiết bị, không nằm ở AI</text>
  </svg>
  </div>
</figure>

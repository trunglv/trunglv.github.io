<figure class="rag-figure">
  <svg viewBox="0 0 960 400" role="img" aria-labelledby="flow-title flow-desc" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
    <title id="flow-title">How a model turns input tokens into output tokens</title>
    <desc id="flow-desc">Input tokens from the prompt and context are read in one parallel pass, which builds a cache of internal state for every token. Then the model generates output one token at a time. Each new token, including thinking tokens, is appended to the sequence and the model runs again. The thinking tokens are part of the output and also feed the model's own reply.</desc>
    <defs>
      <marker id="fa3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6577"/></marker>
      <marker id="fo3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d68910"/></marker>
    </defs>

    <!-- Input -->
    <rect x="30" y="60" width="200" height="110" rx="12" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="130" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">Input tokens</text>
    <text x="130" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">your question, context,</text>
    <text x="130" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">files, CLAUDE.md, history</text>
    <text x="130" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">already a sequence of token IDs</text>

    <line x1="230" y1="115" x2="276" y2="115" stroke="#5b6577" stroke-width="2" marker-end="url(#fa3)"/>

    <!-- Prefill -->
    <rect x="280" y="50" width="230" height="130" rx="12" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="395" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">1. Read the input</text>
    <text x="395" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">all tokens processed together,</text>
    <text x="395" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">in one parallel pass</text>
    <text x="395" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#139e8c">builds internal state</text>
    <text x="395" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#139e8c">(the KV cache) for each token</text>

    <line x1="510" y1="115" x2="556" y2="115" stroke="#5b6577" stroke-width="2" marker-end="url(#fa3)"/>

    <!-- Generate loop -->
    <rect x="560" y="50" width="250" height="130" rx="12" fill="#fff8e6" stroke="#d68910" stroke-width="2"/>
    <text x="685" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">2. Generate, one token at a time</text>
    <text x="685" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">predict the next token from</text>
    <text x="685" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">everything so far</text>
    <text x="685" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#d68910">each step is a full forward pass</text>
    <text x="685" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#d68910">this is what costs compute</text>

    <!-- loop arrow -->
    <path d="M790,180 L790,210 L685,210 L685,184" fill="none" stroke="#d68910" stroke-width="2" marker-end="url(#fo3)"/>
    <text x="740" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#d68910">append the new token, repeat</text>

    <!-- Output -->
    <line x1="810" y1="115" x2="856" y2="115" stroke="#5b6577" stroke-width="2" marker-end="url(#fa3)"/>
    <rect x="860" y="60" width="80" height="110" rx="12" fill="#0e1b3d"/>
    <text x="900" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Output</text>
    <text x="900" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c9f2ea">thinking</text>
    <text x="900" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c9f2ea">+ reply</text>
    <text x="900" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c9f2ea">billed high</text>

    <!-- Thinking feeds reply -->
    <rect x="280" y="250" width="400" height="58" rx="10" fill="#f4f6f8" stroke="#8a94a6" stroke-width="1.5"/>
    <text x="480" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">Thinking tokens are output tokens too</text>
    <text x="480" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">generated the same way, billed as output</text>

    <!-- Cache explanation -->
    <rect x="30" y="250" width="220" height="110" rx="10" fill="#ffffff" stroke="#139e8c" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="140" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">Why the cache helps</text>
    <text x="140" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">step 1 is the expensive part of</text>
    <text x="140" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">re-sending a long history. The cache</text>
    <text x="140" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">keeps step 1's result for reuse, so</text>
    <text x="140" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">only new tokens need the full pass.</text>
    <line x1="250" y1="305" x2="278" y2="305" stroke="#139e8c" stroke-width="1.5" stroke-dasharray="5 4"/>

    <text x="480" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">Simplified. Input is read in one pass; output is produced token by token, so each output token costs a full model step.</text>
  </svg>
  <figcaption style="color:var(--color-text-muted);font-size:0.9rem;margin-top:10px;">Input is read once, in parallel. Output is written one token at a time, and thinking is part of that output.</figcaption>
</figure>

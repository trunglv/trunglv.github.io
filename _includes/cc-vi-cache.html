<figure class="rag-figure">
  <svg viewBox="0 0 960 380" role="img" aria-labelledby="vcache-t vcache-d" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
    <title id="vcache-t">Prompt cache: phần cũ được đọc lại với giá rẻ</title>
    <desc id="vcache-d">Ở lần gửi đầu, cả hồ sơ được ghi vào cache. Từ lần hai, phần đã có từ trước được đọc lại từ cache với giá bằng 0,1 lần giá thường, chỉ phần mới thêm tính giá ghi 1,25 lần. Tới lần mười một, gần như toàn bộ hồ sơ là đọc lại.</desc>
    <defs><marker id="vcachea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6577"/></marker></defs>
    <text x="60" y="28" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">Vẫn những lần gửi đó, tô màu theo giá</text>
    <rect x="60" y="220" width="110" height="70" rx="4" fill="#fff8e6" stroke="#d68910" stroke-width="2"/>
    <text x="115.0" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">Lần gửi 1</text>
    <rect x="270" y="220" width="110" height="70" rx="4" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <rect x="270" y="175" width="110" height="45" rx="4" fill="#fff8e6" stroke="#d68910" stroke-width="2"/>
    <text x="325.0" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">Lần gửi 2</text>
    <rect x="480" y="175" width="110" height="115" rx="4" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <rect x="480" y="140" width="110" height="35" rx="4" fill="#fff8e6" stroke="#d68910" stroke-width="2"/>
    <text x="535.0" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">Lần gửi 3</text>
    <rect x="780" y="80" width="110" height="210" rx="4" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <rect x="780" y="55" width="110" height="25" rx="4" fill="#fff8e6" stroke="#d68910" stroke-width="2"/>
    <text x="835.0" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">Lần gửi 11</text>
    <text x="685" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#5b6577">…</text>
    <text x="685" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">thêm 7 lần gửi nữa</text>
    <text x="115.0" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#5b6577">ghi cả hồ sơ lần đầu</text>
    <text x="325.0" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#5b6577">chỉ phần mới tính giá ghi</text>
    <text x="535.0" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#5b6577">phần cũ ngày càng nhiều</text>
    <text x="835.0" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#5b6577">gần như toàn bộ là đọc lại</text>
    <rect x="60" y="351" width="14" height="14" rx="3" fill="#e8f7f4" stroke="#139e8c" stroke-width="1.5"/>
    <text x="82" y="362" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">đọc lại từ cache: giá 0,1 lần</text>
    <rect x="300" y="351" width="14" height="14" rx="3" fill="#fff8e6" stroke="#d68910" stroke-width="1.5"/>
    <text x="322" y="362" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">phần mới, ghi vào cache: giá 1,25 lần</text>
  </svg>
  <figcaption style="color:var(--color-text-muted);font-size:0.9rem;margin-top:10px;">Hồ sơ vẫn dày lên, nhưng phần dày nhất được tính giá rẻ nhất. Đó là lý do một phiên dài vẫn trả nổi.</figcaption>
</figure>

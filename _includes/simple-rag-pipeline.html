<figure class="rag-figure">
  <svg viewBox="0 0 960 330" role="img" aria-labelledby="pipe-title pipe-desc" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
    <title id="pipe-title">Simple RAG pipeline: offline indexing and online answering</title>
    <desc id="pipe-desc">Offline, ingest.py reads documents, splits them into chunks, embeds each chunk and saves vectors and chunk text to disk. Online, ask.py embeds the question, finds the closest chunks by dot product, builds a prompt and asks the local LLM for an answer with citations.</desc>
    <defs>
      <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#5b6577"/>
      </marker>
    </defs>

    <!-- Lane labels -->
    <text x="20" y="34" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0e1b3d">1. Build the index (ingest.py, run once or when docs change)</text>
    <text x="20" y="184" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0e1b3d">2. Answer a question (ask.py, every request)</text>

    <!-- Lane 1 -->
    <rect x="20" y="48" width="150" height="70" rx="12" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="95" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">docs/*.md</text>
    <text x="95" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">raw files</text>
    <line x1="170" y1="83" x2="206" y2="83" stroke="#5b6577" stroke-width="2" marker-end="url(#pa)"/>

    <rect x="210" y="48" width="150" height="70" rx="12" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="285" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">Chunk</text>
    <text x="285" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">split into pieces</text>
    <line x1="360" y1="83" x2="396" y2="83" stroke="#5b6577" stroke-width="2" marker-end="url(#pa)"/>

    <rect x="400" y="48" width="150" height="70" rx="12" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="475" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">Embed</text>
    <text x="475" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">text to vector</text>
    <line x1="550" y1="83" x2="586" y2="83" stroke="#5b6577" stroke-width="2" marker-end="url(#pa)"/>

    <rect x="590" y="48" width="170" height="70" rx="12" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="675" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">Save to disk</text>
    <text x="675" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">vectors.npy + chunks.jsonl</text>

    <!-- Lane 2 -->
    <rect x="20" y="218" width="150" height="70" rx="12" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="95" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">Question</text>
    <text x="95" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">from the user</text>
    <line x1="170" y1="253" x2="196" y2="253" stroke="#5b6577" stroke-width="2" marker-end="url(#pa)"/>

    <rect x="200" y="218" width="150" height="70" rx="12" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="275" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">Embed + search</text>
    <text x="275" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">top-k chunks</text>
    <line x1="350" y1="253" x2="376" y2="253" stroke="#5b6577" stroke-width="2" marker-end="url(#pa)"/>

    <rect x="380" y="218" width="150" height="70" rx="12" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="455" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">Build prompt</text>
    <text x="455" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">sources + question</text>
    <line x1="530" y1="253" x2="556" y2="253" stroke="#5b6577" stroke-width="2" marker-end="url(#pa)"/>

    <rect x="560" y="218" width="150" height="70" rx="12" fill="#0e1b3d" stroke="#0e1b3d" stroke-width="2"/>
    <text x="635" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">LLM</text>
    <text x="635" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c9f2ea">answer + [n]</text>
    <line x1="710" y1="253" x2="736" y2="253" stroke="#5b6577" stroke-width="2" marker-end="url(#pa)"/>

    <rect x="740" y="218" width="150" height="70" rx="12" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="815" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">Answer</text>
    <text x="815" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">shown to user</text>

    <!-- link lanes: saved index is read at query time -->
    <path d="M675,118 L675,150 L285,150 L285,218" fill="none" stroke="#139e8c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pa)"/>
    <text x="480" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#139e8c">index loaded once at startup, then searched per question</text>
  </svg>
  <figcaption style="color:var(--color-text-muted);font-size:0.9rem;margin-top:10px;">Step 1 runs ahead of time and writes the index. Step 2 reads that index on every question.</figcaption>
</figure>

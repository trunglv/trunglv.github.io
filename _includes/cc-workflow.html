<figure class="rag-figure">
  <svg viewBox="0 0 960 560" role="img" aria-labelledby="wf-title wf-desc" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
    <title id="wf-title">A token-saving workflow for Claude Code</title>
    <desc id="wf-desc">Four phases from top to bottom: set up the project once, start a session, work on one task in a loop, and end the session. After each task, decide whether the next task is related. If it is, continue in the same session and compact with a focus at a natural break. If it is not, clear the conversation so the history drops to zero while the fixed prefix stays cached. A side panel lists tools for tiny one-off jobs: the btw command, a subagent, and print mode.</desc>
    <defs>
      <marker id="wa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6577"/></marker>
      <marker id="wt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#139e8c"/></marker>
      <marker id="wr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    </defs>

    <!-- 1. Setup -->
    <rect x="30" y="30" width="400" height="96" rx="12" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="48" y="54" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">1. Set up, once per project</text>
    <text x="48" y="76" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">CLAUDE.md under 200 lines. Occasional knowledge in skills or path rules.</text>
    <text x="48" y="94" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">Only the MCP servers you need. Cap shell and MCP output.</text>
    <text x="48" y="112" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">A status line that shows context used and cache reads.</text>
    <line x1="230" y1="126" x2="230" y2="156" stroke="#5b6577" stroke-width="2" marker-end="url(#wa)"/>

    <!-- 2. Start -->
    <rect x="30" y="160" width="400" height="96" rx="12" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="48" y="184" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">2. Start a session</text>
    <text x="48" y="206" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">Right directory. Connect MCP servers before the first prompt.</text>
    <text x="48" y="224" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">Pick the model and effort level once; switching rebuilds the cache.</text>
    <text x="48" y="242" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">Open with a specific prompt that names the files or functions.</text>
    <line x1="230" y1="256" x2="230" y2="286" stroke="#5b6577" stroke-width="2" marker-end="url(#wa)"/>

    <!-- 3. Work loop -->
    <rect x="30" y="290" width="400" height="110" rx="12" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="48" y="314" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">3. Work on one task</text>
    <text x="48" y="336" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">Narrow reads: a function or line range, grep before full files.</text>
    <text x="48" y="354" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">Noisy work (tests, logs, surveys) goes to a subagent on Haiku.</text>
    <text x="48" y="372" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">Side questions through /btw. Corrected twice? /clear and re-prompt.</text>
    <text x="48" y="390" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">Check /context when a session feels slow.</text>
    <line x1="230" y1="400" x2="230" y2="430" stroke="#5b6577" stroke-width="2" marker-end="url(#wa)"/>

    <!-- decision -->
    <line x1="430" y1="345" x2="536" y2="345" stroke="#5b6577" stroke-width="2" marker-end="url(#wa)"/>
    <text x="483" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">task done</text>
    <polygon points="640,300 740,345 640,390 540,345" fill="#fff8e6" stroke="#d68910" stroke-width="2"/>
    <text x="640" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">Next task</text>
    <text x="640" y="357" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0e1b3d">related?</text>

    <!-- yes branch -->
    <path d="M640,300 L640,245 L756,245" fill="none" stroke="#139e8c" stroke-width="2.5" marker-end="url(#wt)"/>
    <text x="652" y="266" font-family="Arial, sans-serif" font-size="11" fill="#139e8c">yes</text>
    <rect x="760" y="210" width="180" height="70" rx="12" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="850" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">Keep the session</text>
    <text x="850" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">/compact &lt;focus&gt; at a break</text>
    <text x="850" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">then back to step 3</text>

    <!-- no branch -->
    <path d="M640,390 L640,415 L756,415" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#wr)"/>
    <text x="652" y="408" font-family="Arial, sans-serif" font-size="11" fill="#c0392b">no</text>
    <rect x="760" y="380" width="180" height="70" rx="12" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/>
    <text x="850" y="404" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">/clear</text>
    <text x="850" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">history drops to zero,</text>
    <text x="850" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">fixed prefix stays cached</text>

    <!-- 4. End -->
    <rect x="30" y="434" width="400" height="96" rx="12" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="48" y="458" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">4. End the session</text>
    <text x="48" y="480" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">Back soon? Resume while the cache is warm.</text>
    <text x="48" y="498" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">Back tomorrow? Start fresh; the history would be re-sent in full.</text>
    <text x="48" y="516" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">Keep knowledge in CLAUDE.md and memory, not in the chat.</text>

    <!-- tiny jobs panel -->
    <rect x="480" y="466" width="460" height="80" rx="10" fill="#f4f6f8"/>
    <text x="496" y="488" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1b3d">Tiny one-off jobs, no session needed</text>
    <text x="496" y="508" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">/btw: a quick question, answer never enters history</text>
    <text x="496" y="524" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">subagent: isolated job, only the summary returns</text>
    <text x="496" y="540" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">claude -p "...": one scripted task, standalone request</text>
  </svg>
  <figcaption style="color:var(--color-text-muted);font-size:0.9rem;margin-top:10px;">The decision after each task is the one that matters most: related work stays in the session, unrelated work starts from a cleared context.</figcaption>
</figure>

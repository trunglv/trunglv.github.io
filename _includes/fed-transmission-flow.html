<figure class="rag-figure">
  <svg viewBox="0 0 960 640" role="img" aria-labelledby="fed-title fed-desc" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
    <title id="fed-title">How a Fed rate decision reaches borrowers, step by step</title>
    <desc id="fed-desc">Six steps. The Fed sets a target range for the federal funds rate. Overnight interbank rates move inside that range. Short-term rates follow. Banks set the prime rate at about three points above the top of the range. Credit cards, personal loans and auto loans, which are mostly floating, reset to prime within one or two billing cycles. Mortgage rates and long-term bond yields respond only indirectly, through inflation expectations and the 10-year Treasury yield.</desc>
    <defs>
      <marker id="fv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6577"/></marker>
    </defs>

    <!-- Step 1: Fed decision -->
    <rect x="40" y="60" width="440" height="56" rx="10" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="260" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">1. FED điều chỉnh khoảng mục tiêu</text>
    <text x="260" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">federal funds target range</text>
    <rect x="520" y="60" width="400" height="56" rx="10" fill="#f4f6f8"/>
    <text x="540" y="84" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">Ví dụ: 3,75%–4,00% từ quyết định tháng 9/2026.</text>
    <text x="540" y="103" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">Đây là quyết định của FED.</text>
    <line x1="480" y1="88" x2="520" y2="88" stroke="#8a94a6" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="260" y1="116" x2="260" y2="152" stroke="#5b6577" stroke-width="2" marker-end="url(#fv)"/>

    <!-- Step 2: Overnight rate -->
    <rect x="40" y="156" width="440" height="56" rx="10" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="260" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">2. Lãi suất qua đêm giữa các ngân hàng</text>
    <text x="260" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">federal funds rate, nằm trong khoảng mục tiêu</text>
    <rect x="520" y="156" width="400" height="56" rx="10" fill="#f4f6f8"/>
    <text x="540" y="180" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">IORB và ON RRP giữ lãi suất qua đêm</text>
    <text x="540" y="199" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">trong khoảng mục tiêu mà FED đã đặt.</text>
    <line x1="480" y1="184" x2="520" y2="184" stroke="#8a94a6" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="260" y1="212" x2="260" y2="248" stroke="#5b6577" stroke-width="2" marker-end="url(#fv)"/>

    <!-- Step 3: Short-term rates -->
    <rect x="40" y="252" width="440" height="56" rx="10" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="260" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">3. Lãi suất ngắn hạn</text>
    <text x="260" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">tín dụng và tiền gửi ngắn hạn thay đổi theo</text>
    <rect x="520" y="252" width="400" height="56" rx="10" fill="#f4f6f8"/>
    <text x="540" y="276" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">Ngân hàng điều chỉnh lãi suất huy động</text>
    <text x="540" y="295" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">và cho vay ngắn hạn, thường chậm hơn ở tiền gửi.</text>
    <line x1="480" y1="280" x2="520" y2="280" stroke="#8a94a6" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="260" y1="308" x2="260" y2="344" stroke="#5b6577" stroke-width="2" marker-end="url(#fv)"/>

    <!-- Step 4: Prime rate -->
    <rect x="40" y="348" width="440" height="56" rx="10" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="260" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">4. Lãi suất cơ bản (prime rate)</text>
    <text x="260" y="391" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">thường = cận trên khoảng mục tiêu + 3 điểm %</text>
    <rect x="520" y="348" width="400" height="56" rx="10" fill="#f4f6f8"/>
    <text x="540" y="372" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">Mức nền để ngân hàng tính lãi cho</text>
    <text x="540" y="391" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">nhiều khoản vay thả nổi của khách hàng.</text>
    <line x1="480" y1="376" x2="520" y2="376" stroke="#8a94a6" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="260" y1="404" x2="260" y2="440" stroke="#5b6577" stroke-width="2" marker-end="url(#fv)"/>

    <!-- Step 5: Floating consumer loans -->
    <rect x="40" y="444" width="440" height="56" rx="10" fill="#fff8e6" stroke="#d68910" stroke-width="2"/>
    <text x="260" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">5. Thẻ tín dụng, vay tiêu dùng, vay mua xe</text>
    <text x="260" y="487" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">lãi suất thả nổi, đi theo prime</text>
    <rect x="520" y="444" width="400" height="56" rx="10" fill="#fff8e6"/>
    <text x="540" y="468" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#d68910">Đây là chỗ bạn cảm nhận ngay.</text>
    <text x="540" y="487" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">Thường đổi trong 1–2 chu kỳ thanh toán.</text>
    <line x1="480" y1="472" x2="520" y2="472" stroke="#d68910" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="260" y1="500" x2="260" y2="536" stroke="#5b6577" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fv)"/>

    <!-- Step 6: Mortgage and long-term bonds -->
    <rect x="40" y="540" width="440" height="56" rx="10" fill="#ffffff" stroke="#8a94a6" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="260" y="564" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0e1b3d">6. Thế chấp và trái phiếu dài hạn</text>
    <text x="260" y="583" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">gián tiếp: kỳ vọng lạm phát, trái phiếu 10 năm</text>
    <rect x="520" y="540" width="400" height="56" rx="10" fill="#f4f6f8"/>
    <text x="540" y="564" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">FED không đặt trực tiếp lãi suất thế chấp.</text>
    <text x="540" y="583" font-family="Arial, sans-serif" font-size="12" fill="#0e1b3d">Thị trường trái phiếu phản ứng trước và mạnh hơn.</text>
    <line x1="480" y1="568" x2="520" y2="568" stroke="#8a94a6" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Legend -->
    <rect x="40" y="614" width="14" height="14" rx="3" fill="#ffffff" stroke="#0e1b3d" stroke-width="2"/>
    <text x="62" y="626" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">FED quyết định</text>
    <rect x="200" y="614" width="14" height="14" rx="3" fill="#e8f7f4" stroke="#139e8c" stroke-width="2"/>
    <text x="222" y="626" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">Thị trường và ngân hàng</text>
    <rect x="400" y="614" width="14" height="14" rx="3" fill="#fff8e6" stroke="#d68910" stroke-width="2"/>
    <text x="422" y="626" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">Chạm trực tiếp khoản vay thả nổi</text>
    <rect x="660" y="614" width="14" height="14" rx="3" fill="#ffffff" stroke="#8a94a6" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="682" y="626" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">Tác động gián tiếp</text>
  </svg>
  <figcaption style="color:var(--color-text-muted);font-size:0.9rem;margin-top:10px;">Càng xuống dưới, tác động của quyết định FED càng gián tiếp. Thẻ tín dụng và khoản vay thả nổi là chỗ bạn cảm nhận nhanh nhất.</figcaption>
</figure>
